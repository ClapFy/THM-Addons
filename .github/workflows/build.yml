name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1.1", "26.1.2", "26.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Build ${{ matrix.mc }}
        run: ./gradlew --no-daemon build -Pmc=${{ matrix.mc }}
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: THM-Addons-${{ matrix.mc }}
          path: build/libs/*.jar
