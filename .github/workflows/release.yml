name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.8). Leave empty to use v<mod-version>."
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1.1", "26.1.2", "26.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Build ${{ matrix.mc }}
        run: ./gradlew --no-daemon build -Pmc=${{ matrix.mc }}
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: THM-Addons-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect jars
        run: |
          mkdir -p dist
          find artifacts -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} dist/ \;
          echo "Release jars:"
          ls -la dist
          test "$(find dist -name '*.jar' | wc -l)" -eq 3
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          MOD_VERSION=$(sed -n 's/^mod-version = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v${MOD_VERSION}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using release tag ${TAG} (mod ${MOD_VERSION})"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: THM-Addons ${{ steps.tag.outputs.name }}
          files: dist/*.jar
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Fabric jars for every supported Minecraft version on this branch:

            | File | Minecraft |
            | --- | --- |
            | `THM-Addons-*-26.1.1.jar` | 26.1.1 |
            | `THM-Addons-*-26.1.2.jar` | 26.1.2 |
            | `THM-Addons-*-26.2.jar` | 26.2 |

            Install the jar that matches your Minecraft version. Drop it in `.minecraft/mods` with Fabric Loader, Fabric API, and Meteor Client.
